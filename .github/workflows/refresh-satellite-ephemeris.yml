name: Refresh satellite ephemeris

# The bundled ISS / Hubble ephemeris files cover only a fixed window (see
# scripts/generate_satellite_ephemeris.py). Once the window elapses, satellite
# positions and ISS pass predictions go stale. This workflow regenerates the
# data from NASA Horizons on a schedule, commits the refreshed binaries, and
# deploys them to Cloudflare Pages. A commit alone does not update the live site.
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID;
# see scripts/README.md for setup and recovery.
#
# Safety net: even if a run fails (e.g. Horizons is unreachable) or the deploy
# lags, the web UI detects out-of-range coverage and shows a "data out of date"
# indicator instead of silently rendering stale positions (see iss-passes-ui.ts).
#
# Window lengths are per-satellite (see #91). Horizons publishes *predicted*
# spacecraft trajectories, and the prediction degrades with forecast horizon,
# not with how long ago the file was generated: measured ISS error against a
# fresh Horizons pull was ~4 km at +5.5 d, ~26 km at +9.5 d, ~107 km at +16.5 d
# and ~242 km (≈31 s of along-track motion) at +23.5 d. So the ISS window is
# deliberately capped at 14 days — worst-case tail error ~72 km (≈9 s) while
# still leaving a 7-day buffer if one weekly run fails. Hubble stays at 45 days
# (Horizons clamps it to its own cutoff): it orbits higher, where drag-driven
# divergence is far weaker, and it has no pass-prediction UI riding on it.

on:
  schedule:
    # Weekly, Mondays 06:00 UTC. Both generated windows are wider than the
    # 7-day cadence, so consecutive failures can occur before coverage lapses
    # (14 days for the ISS leaves a one-run buffer; 45 days for Hubble leaves
    # several).
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      iss_window_days:
        description: "Days of ISS ephemeris to generate from today"
        required: false
        default: "14"
      window_days:
        description: "Days of Hubble ephemeris to generate from today"
        required: false
        default: "45"

# Never run two refreshes concurrently — they would race on the same commit.
concurrency:
  group: refresh-satellite-ephemeris
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate ISS & Hubble ephemeris
    # Manual runs from feature branches must not replace production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compute end dates
        id: dates
        run: |
          ISS_WINDOW="${{ github.event.inputs.iss_window_days || '14' }}"
          HUBBLE_WINDOW="${{ github.event.inputs.window_days || '45' }}"
          ISS_END="$(date -u -d "+${ISS_WINDOW} days" +%Y-%m-%d)"
          HUBBLE_END="$(date -u -d "+${HUBBLE_WINDOW} days" +%Y-%m-%d)"
          # Only the end dates are consumed downstream (generation + commit
          # message); the window lengths are logged below, not exported.
          echo "iss_end=${ISS_END}" >> "$GITHUB_OUTPUT"
          echo "hubble_end=${HUBBLE_END}" >> "$GITHUB_OUTPUT"
          echo "ISS: ${ISS_WINDOW} days (through ${ISS_END})"
          echo "Hubble: ${HUBBLE_WINDOW} days (through ${HUBBLE_END})"

      # Fail-closed (issue #147): the generator validates the full Horizons
      # response (markers, finite values, monotonic cadence, coverage of the
      # possibly cutoff-clamped window) and only then atomically replaces the
      # output; on any failure it exits non-zero and leaves the prior binary
      # untouched. No step below sets continue-on-error or `if: always()`, so
      # a failure in either generation step stops the job before the commit,
      # build and deploy steps run.
      - name: Generate ISS ephemeris
        run: |
          python scripts/generate_satellite_ephemeris.py iss \
            --end "${{ steps.dates.outputs.iss_end }}" \
            --output apps/web/public/data/iss_ephemeris.bin

      - name: Generate Hubble ephemeris
        run: |
          python scripts/generate_satellite_ephemeris.py hubble \
            --end "${{ steps.dates.outputs.hubble_end }}" \
            --output apps/web/public/data/hubble_ephemeris.bin

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/iss_ephemeris.bin apps/web/public/data/hubble_ephemeris.bin
          if git diff --cached --quiet; then
            echo "Ephemeris unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh ISS (through ${{ steps.dates.outputs.iss_end }}) & Hubble (through ${{ steps.dates.outputs.hubble_end }}) ephemeris"
          git push

      # Deploy in this workflow: pushes made with GITHUB_TOKEN do not trigger
      # another push workflow, and this Pages project is deployed via Wrangler.
      # These steps also run when the data was unchanged, so rerunning a failed
      # deployment can recover without needing a new data commit.
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see scripts/README.md). Data was committed but has not been deployed."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site with refreshed data
        run: pnpm build:all

      - name: Deploy production site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm --filter once-around-web exec wrangler pages deploy dist --project-name=once-around --branch=main

      - name: Verify production serves the refreshed ephemerides
        run: |
          for satellite in iss hubble; do
            file="${satellite}_ephemeris.bin"
            matched=false
            for attempt in {1..6}; do
              echo "Checking production ${satellite} ephemeris (attempt ${attempt}/6)."
              if curl --fail --silent --show-error --max-time 30 \
                "https://once-around.pages.dev/data/${file}" -o "${RUNNER_TEMP}/${file}" \
                && cmp --silent "apps/web/public/data/${file}" "${RUNNER_TEMP}/${file}"; then
                matched=true
                break
              fi
              sleep 10
            done
            if [[ "$matched" != true ]]; then
              echo "::error::Production is not serving the refreshed ${satellite} ephemeris."
              exit 1
            fi
            echo "Production ${satellite} ephemeris matches the refreshed data."
          done
