packages:
  - "apps/*"
  - "crates/*"

# Build-script approval list (the `allowBuilds` gate introduced in pnpm 10/11).
#
# Modern pnpm does not run dependency install/postinstall scripts by default. On a
# fresh non-interactive `pnpm install` it skips them and *appends a placeholder stub
# to this file* ("set this to true or false" for each package), which dirties the
# working tree of every fresh clone and agent worktree. CI didn't see this at first
# because `.github/workflows/ci.yml` pinned pnpm to major 9, which predates the gate;
# CI now uses the `packageManager` pin in package.json (#113).
#
# All four packages below ship native binaries that their install scripts fetch or
# compile, and every one sits on a build/dev/deploy path this repo actually uses --
# skipping any of them degrades tooling silently rather than failing loudly. Hence
# an explicit, deliberately committed `true` for each:
#
#   @swc/core  <- vite-plugin-top-level-await  (native SWC binding, used at build time)
#   esbuild    <- vite (dev server + `pnpm build`) and wrangler (deploy tooling)
#   sharp      <- wrangler -> miniflare        (local Workers runtime image codecs)
#   workerd    <- wrangler -> miniflare / @cloudflare/unenv-preset (the Workers runtime)
#
# Adding a dependency that ships a build script will re-trigger the stub. Replace it
# with a deliberate entry here (plus a justification) rather than reverting the diff.
allowBuilds:
  "@swc/core": true
  esbuild: true
  sharp: true
  workerd: true

# Security floors for transitive dependencies whose parents pin a vulnerable
# version exactly or never re-resolve it (Dependabot alerts, 2026-10-16). Each
# selector only matches versions below the fix, so an entry stops applying once
# the parent moves past it — delete it then.
#
#   sharp   <- miniflare (exact 0.35.4) <- wrangler 4.144.0
#   uuid    <- vite-plugin-top-level-await (exact 10.0.0; only uses the CJS v5 export)
#
# rollup is NOT overridden here: it is an optional peer of @rollup/plugin-virtual
# (via vite-plugin-top-level-await) that vite.config.ts needs at load time, and an
# override stops pnpm auto-installing it. It is a direct devDependency of
# apps/web instead, at a patched version.
overrides:
  "sharp@<0.35.5": "^0.35.5"
  "uuid@<11.1.1": "^11.1.1"
