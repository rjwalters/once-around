[package]
name = "sky_engine"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sky_engine_core = { path = "../sky_engine_core" }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

# Dev-only: the offline SGP4 cross-check of the committed ISS ephemeris
# (tests/sgp4_cross_check.rs). Both crates are pure Rust and wasm32-clean, but
# they are deliberately dev-dependencies so `pnpm build:wasm` (release cdylib)
# never links them. See issue #90.
[dev-dependencies]
sgp4 = "2.4"
erfa = "0.2"

# wasm-pack runs wasm-opt on the release binary. Default is plain "-O"; "-O3"
# is the highest speed-focused level and also shrinks the module further via
# aggressive DCE/inlining. See issue #14 for before/after size numbers.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
